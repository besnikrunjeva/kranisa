    <script>
      // Applied before first paint to avoid a light-mode flash on load —
      // ThemeSwitcher.jsx owns the toggle/localStorage key, this just
      // mirrors its logic synchronously.
      (function () {
        try {
          var stored = localStorage.getItem('kranisa-color-scheme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
